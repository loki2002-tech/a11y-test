<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- BUG: Missing <title> element (WCAG 2.4.2) -->
    <!-- BUG: Missing lang attribute on <html> (WCAG 3.1.1) -->
  </head>
  <body>
    <header>
      <!-- BUG: Missing role and accessible name (WCAG 4.1.2) -->
      <button class="menu-toggle" onclick="toggleMenu()"></button>
    </header>

    <main>
      <section class="registration-form">
        <h1>Create Account</h1>

        <form id="register-form" action="/register" method="POST">

          <!-- BUG: Input has no associated <label> (WCAG 1.3.1, 4.1.2) -->
          <input
            id="full-name"
            class="form-input"
            type="text"
            placeholder="Full Name"
          />

          <input
            id="email-address"
            class="form-input form-input--email"
            type="email"
            placeholder="Email address"
          />

          <!-- BUG: Button missing accessible name — no text content (WCAG 4.1.2) -->
          <button class="register-btn" type="submit">
            <img src="/icons/check.svg" />
          </button>

        </form>
      </section>

      <nav class="site-nav">
        <!-- BUG: Link has generic text (WCAG 2.4.4) -->
        <a href="/about" class="nav-link">Click here</a>
        <a href="/contact" class="nav-link">More info</a>
      </nav>

      <!-- BUG: Image missing alt attribute (WCAG 1.1.1) -->
      <img src="/hero.jpg" class="hero-image" />

    </main>
  </body>
</html>
