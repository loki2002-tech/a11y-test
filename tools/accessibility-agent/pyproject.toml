[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accessibility-agent"
version = "0.1.0"
description = "AI-Powered Accessibility Testing Agent — deterministic-first, AI-assisted reasoning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["accessibility", "wcag", "a11y", "playwright", "axe-core", "testing"]

dependencies = [
    # Browser automation
    "playwright>=1.47.0",

    # AI / LLM
    "google-generativeai>=0.8.0",
    "openai>=1.50.0",

    # Data validation and schemas
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",

    # HTTP and async utilities
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",

    # Templating for HTML reports
    "jinja2>=3.1.4",

    # Config and environment
    "python-dotenv>=1.0.1",

    # CLI interface
    "typer[all]>=0.12.5",
    "rich>=13.8.0",

    # Logging and observability
    "structlog>=24.4.0",

    # Image processing for visual evidence
    "Pillow>=10.4.0",

    # Hashing / deduplication
    "xxhash>=3.5.0",

    # CSV / reporting
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-playwright>=0.5.1",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[project.scripts]
a11y-agent = "accessibility_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
