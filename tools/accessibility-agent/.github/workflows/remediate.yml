# ──────────────────────────────────────────────────────────────────────────────
# AI Accessibility Agent — Autonomous Remediation in CI
#
# This workflow triggers AFTER a scan report is published as a GitHub artifact.
# It reads the findings JSON, picks the highest-severity auto-fixable finding,
# runs the RemediationAgent, and opens a PR if successful.
#
# Trigger manually with:
#   gh workflow run remediate.yml -f finding_id=A11Y-XXXX -f repo_path=.
#
# Or call it from another workflow via workflow_call.
# ──────────────────────────────────────────────────────────────────────────────
name: Auto-Remediate Accessibility Finding

on:
  workflow_dispatch:
    inputs:
      finding_json:
        description: >
          The full Finding JSON (copy from scan output or reports/).
          Must be a valid JSON object matching the Finding schema.
        required: true
        type: string
      repo_path:
        description: Path to the target repo within this workspace (usually '.')
        required: false
        default: "."
        type: string
      dry_run:
        description: "If true, plan the fix but do not commit or open a PR"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

  # Allow other workflows to call this one
  workflow_call:
    inputs:
      finding_json:
        required: true
        type: string
      repo_path:
        required: false
        default: "."
        type: string
      dry_run:
        required: false
        default: "false"
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true
      GROQ_API_KEY:
        required: false

jobs:
  remediate:
    name: Remediate Finding
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push branch
      pull-requests: write # open PR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # Full history so git branch works cleanly
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Write finding JSON to file
        run: |
          echo '${{ inputs.finding_json }}' > /tmp/finding.json

      - name: Validate finding JSON
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'src')
          from accessibility_agent.wcag.schemas import Finding
          data = json.loads(Path('/tmp/finding.json').read_text())
          f = Finding.model_validate(data)
          print(f'Finding validated: {f.finding_id} ({f.rule_id})')
          "

      - name: Run Remediation Agent
        id: remediate
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m accessibility_agent.cli remediate \
            --finding /tmp/finding.json \
            --repo "${{ inputs.repo_path }}" \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }} \
            --output /tmp/remediation_result.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload remediation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-result
          path: /tmp/remediation_result.json

      - name: Print result summary
        if: always()
        run: |
          python -c "
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/remediation_result.json').read_text())
          print('Status    :', result.get('status'))
          print('PR URL    :', result.get('pr_url', 'N/A'))
          print('Attempts  :', result.get('attempts'))
          print('Tests Pass:', result.get('tests_passed'))
          if result.get('failure_reason'):
              print('Failure   :', result['failure_reason'])
          " || echo "Could not read result JSON"
