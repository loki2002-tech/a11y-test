name: AI Accessibility Auto-Remediation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  a11y-scan-and-fix:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install AI Accessibility Agent
        run: |
          pip install -e tools/accessibility-agent
          playwright install chromium --with-deps
          
      - name: Start local test server
        run: |
          python -m http.server 8080 &
          sleep 3
          
      - name: Run Scan & Auto-Remediate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Run the scan
          python -m accessibility_agent.cli scan \
            --url http://localhost:8080/index.html \
            --mode automated \
            --agentic \
            --output ./reports
          
          # 2. Check for findings
          echo "Looking for findings..."
          python -c "
          import json, glob, sys
          try:
              files = sorted(glob.glob('reports/*_report.json'))
              if not files: sys.exit(0)
              r = json.load(open(files[-1]))
              # Get the html-has-lang finding
              findings = [f for f in r['findings'] if f.get('rule_id') == 'html-has-lang' and f.get('status') == 'confirmed']
              if findings:
                  print('Found finding:', findings[0]['finding_id'])
                  with open('finding.json', 'w') as f:
                      json.dump(findings[0], f)
          except Exception as e:
              print('Error:', e)
          "
          
          # 3. If a finding exists, trigger the remediation agent
          if [ -f "finding.json" ]; then
            echo "Found accessibility violation. Triggering Remediation Agent..."
            python -m accessibility_agent.cli remediate \
              --finding finding.json \
              --repo .
          else
            echo "No accessibility violations found! ✅"
          fi
