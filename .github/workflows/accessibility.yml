name: AI Accessibility Auto-Remediation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  a11y-scan-and-fix:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install AI Accessibility Agent
        run: |
          pip install groq -e tools/accessibility-agent
          playwright install chromium --with-deps
          
      - name: Start local test server
        run: |
          python -m http.server 8080 &
          sleep 3
          
      - name: Run Scan & Auto-Remediate
        env:
          A11Y_LLM_PROVIDER: groq
          A11Y_LLM_MODEL: openai/gpt-oss-120b
          A11Y_GROQ_API_KEYS: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 0. Configure Git identity
          git config --global user.name "accessibility-agent[bot]"
          git config --global user.email "accessibility-agent[bot]@users.noreply.github.com"
          
          # 1. Run the scan
          python -m accessibility_agent.cli scan \
            --url http://localhost:8080/index.html \
            --mode automated \
            --agentic \
            --output ./reports
          
          # 2. Check for findings
          echo "Looking for findings..."
          python -c "
          import json, glob, sys
          try:
              files = sorted(glob.glob('reports/*_report.json'))
              if not files: sys.exit(0)
              r = json.load(open(files[-1]))
              # Get the first 3 confirmed findings that are not color-contrast
              findings = [f for f in r['findings'] if f.get('status') == 'confirmed' and f.get('rule_id') != 'color-contrast']
              for i, finding in enumerate(findings[:3]):
                  print(f'Found finding: {finding[\"finding_id\"]}')
                  with open(f'finding_{i}.json', 'w') as f:
                      json.dump(finding, f)
          except Exception as e:
              print('Error:', e)
          "
          
          # 3. Trigger the remediation agent for each finding
          for file in finding_*.json; do
            if [ -f "$file" ]; then
              echo "Triggering Remediation Agent for $file..."
              python -m accessibility_agent.cli remediate \
                --finding "$file" \
                --repo .
            fi
          done
