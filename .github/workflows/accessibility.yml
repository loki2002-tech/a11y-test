name: AI Accessibility Auto-Remediation

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  a11y-scan-and-fix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        page:
          - index.html
          - a11y-test-page-2-dashboard.html
          - a11y-test-page-3-news.html
          - a11y-test-page-4-checkout.html
          - a11y-test-page-5-app.html
          - a11y-test-page-6-hotel.html
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install AI Accessibility Agent
        run: |
          pip install groq -e tools/accessibility-agent
          playwright install chromium --with-deps
          
      - name: Start local test server
        run: |
          python -m http.server 8080 &
          sleep 3
          
      - name: Run Scan & Auto-Remediate
        env:
          A11Y_LLM_PROVIDER: groq
          A11Y_LLM_MODEL: openai/gpt-oss-120b
          A11Y_GROQ_API_KEYS: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.name "accessibility-agent[bot]"
          git config --global user.email "accessibility-agent[bot]@users.noreply.github.com"
          
          mkdir -p reports
          PAGE_URL="http://localhost:8080/${{ matrix.page }}"
          
          echo "==> Scanning: $PAGE_URL"
          python -m accessibility_agent.cli scan \
            --url "$PAGE_URL" \
            --mode automated \
            --agentic \
            --output ./reports || true
            
          echo "Looking for findings..."
          python -c "
          import json, glob, sys
          try:
              files = glob.glob('reports/*_report.json')
              if not files: sys.exit(0)
              
              seen = set()
              unique = []
              
              for report_file in files:
                  try:
                      r = json.load(open(report_file))
                      findings = [f for f in r.get('findings', [])
                                  if f.get('status') == 'confirmed'
                                  and f.get('rule_id') != 'color-contrast']
                      for f in findings:
                          fid = f.get('finding_id')
                          if fid and fid not in seen:
                              seen.add(fid)
                              unique.append(f)
                  except Exception as e:
                      print(f'Error reading {report_file}: {e}')
              
              print(f'Total unique findings: {len(unique)}')
              for i, finding in enumerate(unique):
                  with open(f'finding_{i}.json', 'w') as out:
                      json.dump(finding, out)
          except Exception as e:
              print('Error:', e)
          "
          
          for file in finding_*.json; do
            if [ -f "$file" ]; then
              echo "Triggering Remediation Agent for $file..."
              python -m accessibility_agent.cli remediate \
                --finding "$file" \
                --output "result_${file}" \
                --repo . || true
              sleep 2
            fi
          done

      - name: Report Manual Review Findings as GitHub Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          python -c "
          import json, glob, subprocess, os

          # Read the output results, not the inputs!
          result_files = sorted(glob.glob('result_finding_*.json'))
          manual = []
          for res_file in result_files:
              try:
                  res = json.load(open(res_file))
                  status = res.get('status')
                  
                  # Only escalate genuine manual review requirements
                  if status == 'MANUAL_REVIEW' or status == 'FAILED':
                      notes = res.get('manual_review_notes', '')
                      if 'FALSE POSITIVE' in notes or 'LLM planning unavailable' in notes:
                          continue # Filter out False Positives and rate-limit drops
                      
                      # Extract the original finding details
                      finding_file = res_file.replace('result_', '')
                      d = json.load(open(finding_file))
                      
                      rule = d.get('rule_id', 'unknown')
                      sc   = d.get('wcag', {}).get('success_criterion', '?')
                      fid  = d.get('finding_id', '?')
                      desc = d.get('description', '')[:120]
                      
                      element = d.get('element', {})
                      html = element.get('html', 'N/A')
                      if len(html) > 50: html = html[:47] + '...'
                      html = html.replace('|', '\|').replace('\n', ' ')
                      
                      selector = element.get('selector', 'N/A')
                      if isinstance(selector, list): selector = selector[0] if selector else 'N/A'
                      selector = str(selector).replace('|', '\|')
                      
                      manual.append((fid, rule, sc, desc, html, selector, notes[:200]))
              except Exception:
                  pass

          if not manual:
              print('No findings to report.')
              exit(0)

          lines = [
              '## ♿ Accessibility Findings for ${{ matrix.page }}',
              '',
              'The AI agent scanned this page and found the following issues that **cannot be auto-fixed** and need a human developer to resolve.',
              '',
              '| # | Finding ID | Rule | WCAG SC | CSS Selector | HTML Snippet | Description | AI Notes |',
              '|---|-----------|------|---------|-------------|--------------|-------------|----------|',
          ]
          for i, (fid, rule, sc, desc, html, selector, notes) in enumerate(manual, 1):
              lines.append(f'| {i} | `{fid}` | `{rule}` | {sc} | `{selector}` | `{html}` | {desc} | {notes} |')

          body = '\n'.join(lines)
          with open('/tmp/issue_body.md', 'w') as f:
              f.write(body)

          repo = os.environ.get('GITHUB_REPOSITORY', '')
          title = f'[A11y] Findings requiring manual review for ${{ matrix.page }}'

          result = subprocess.run(
              ['gh', 'issue', 'list', '--repo', repo, '--search', f'in:title \"{title}\"', '--state', 'open', '--json', 'number'],
              capture_output=True, text=True
          )
          existing = json.loads(result.stdout or '[]')

          if existing:
              issue_num = existing[0]['number']
              subprocess.run(['gh', 'issue', 'edit', str(issue_num), '--repo', repo,
                              '--title', title, '--body-file', '/tmp/issue_body.md'])
              print(f'Updated existing issue #{issue_num}')
          else:
              subprocess.run(['gh', 'issue', 'create', '--repo', repo,
                              '--title', title,
                              '--body-file', '/tmp/issue_body.md',
                              '--label', 'accessibility'])
              print(f'Created new issue: {title}')
          "
