name: AI Accessibility Auto-Remediation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  a11y-scan-and-fix:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install AI Accessibility Agent
        run: |
          pip install -e tools/accessibility-agent
          playwright install chromium --with-deps
          
      - name: Start local test server
        run: |
          python -m http.server 8080 &
          sleep 3
          
      - name: Run Scan & Auto-Remediate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Run the scan
          python -m accessibility_agent.cli scan \
            --url http://localhost:8080/index.html \
            --mode automated \
            --output ./reports
          
          # 2. Check for findings
          echo "Looking for findings..."
          FINDING_ID=$(python -c "
          import json, glob, sys
          try:
              files = sorted(glob.glob('reports/*_report.json'))
              if not files: sys.exit(0)
              r = json.load(open(files[-1]))
              # Get the first confirmed finding
              findings = [f['finding_id'] for f in r['findings'] if f.get('confidence') == 'confirmed']
              if findings: print(findings[0])
          except Exception as e:
              pass
          ")
          
          # 3. If a finding exists, trigger the remediation agent
          if [ ! -z "$FINDING_ID" ]; then
            echo "Found accessibility violation: $FINDING_ID. Triggering Remediation Agent..."
            LATEST_JSON=$(ls -t reports/*_report.json | head -1)
            python -m accessibility_agent.cli remediate \
              --finding "$FINDING_ID" \
              --repo . \
              --json "$LATEST_JSON"
          else
            echo "No accessibility violations found! ✅"
          fi
